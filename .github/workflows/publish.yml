# Publishes exact tarballs prepared from a signed stable release tag.
# Authentication is npm trusted-publisher OIDC only; no token fallback exists.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.digest }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}

    steps:
      - name: Authenticate the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases may publish packages"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error::RELEASE_TAG must be a stable supported version"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::RELEASE_COMMIT must be an exact commit"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain reviewed entries"
            exit 1
          fi
          release_repo="$(mktemp -d "${RUNNER_TEMP}/release-git.XXXXXX")"
          trap 'rm -rf "${release_repo}"' EXIT
          git init --bare "${release_repo}"
          git -C "${release_repo}" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          allowed_signers="${release_repo}/allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          git -C "${release_repo}" config gpg.format ssh
          git -C "${release_repo}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${release_repo}" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${release_repo}" cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          git -C "${release_repo}" verify-tag "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git -C "${release_repo}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "${tag_commit}" == "${RELEASE_COMMIT,,}" ]]
          git -C "${release_repo}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Use the reviewed npm release
        run: npm install --global npm@11.18.0 --ignore-scripts --registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Prepare release tarballs
        run: pnpm run release:pack -- --require-clean --output .release

      - name: Record the package manifest digest
        id: manifest
        shell: bash
        run: echo "digest=$(sha256sum .release/package-manifest.json | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Upload the prepared release
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: scheduler-release-${{ github.run_id }}
          path: .release/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: true
          retention-days: 30

  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Use the reviewed npm release
        run: npm install --global npm@11.18.0 --ignore-scripts --registry https://registry.npmjs.org/

      - name: Download the prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scheduler-release-${{ github.run_id }}
          path: .release

      - name: Install and import the prepared packages
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/release-smoke.XXXXXX")"
          trap 'rm -rf "${smoke_dir}"' EXIT
          printf '%s\n' '{"name":"release-smoke","private":true,"type":"module"}' > "${smoke_dir}/package.json"
          mapfile -t tarballs < <(node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { resolve } from "node:path";
          const directory = resolve(".release");
          const manifest = JSON.parse(await readFile(resolve(directory, "package-manifest.json"), "utf8"));
          for (const record of manifest.packages) console.log(resolve(directory, record.tarball));
          NODE
          )
          npm install --prefix "${smoke_dir}" --ignore-scripts --no-audit --no-fund \
            --package-lock=false "${tarballs[@]}"
          cd "${smoke_dir}"
          node --input-type=module --eval \
            'await import("@pegma/scheduler"); await import("@pegma/scheduler-cloudflare");'

  publish:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}

    steps:
      - name: Authenticate the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases may publish packages"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error::RELEASE_TAG must be a stable supported version"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::RELEASE_COMMIT must be an exact commit"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain reviewed entries"
            exit 1
          fi
          release_repo="$(mktemp -d "${RUNNER_TEMP}/release-git.XXXXXX")"
          trap 'rm -rf "${release_repo}"' EXIT
          git init --bare "${release_repo}"
          git -C "${release_repo}" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          allowed_signers="${release_repo}/allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          git -C "${release_repo}" config gpg.format ssh
          git -C "${release_repo}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${release_repo}" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${release_repo}" cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          git -C "${release_repo}" verify-tag "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git -C "${release_repo}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "${tag_commit}" == "${RELEASE_COMMIT,,}" ]]
          git -C "${release_repo}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Use the reviewed npm release
        run: npm install --global npm@11.18.0 --ignore-scripts --registry https://registry.npmjs.org/

      - name: Download the prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scheduler-release-${{ github.run_id }}
          path: .release

      - name: Verify and publish the prepared packages
        env:
          MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { createHash, timingSafeEqual } from "node:crypto";
          import { lstat, mkdtemp, readFile, readdir, writeFile } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { resolve } from "node:path";

          const fail = (message) => { throw new Error(message); };
          const equal = (left, right) => {
            const a = Buffer.from(left);
            const b = Buffer.from(right);
            return a.length === b.length && timingSafeEqual(a, b);
          };
          const releaseDirectory = resolve(".release");
          const manifestPath = resolve(releaseDirectory, "package-manifest.json");
          const manifestBytes = await readFile(manifestPath);
          const digest = createHash("sha256").update(manifestBytes).digest("hex");
          if (!equal(digest, process.env.MANIFEST_DIGEST ?? "")) fail("package manifest digest does not match");
          const manifest = JSON.parse(manifestBytes.toString("utf8"));
          const names = ["@pegma/scheduler", "@pegma/scheduler-cloudflare"];
          if (manifest.schemaVersion !== 1 || manifest.gitCommit !== process.env.RELEASE_COMMIT ||
              manifest.releaseTag !== process.env.RELEASE_TAG || !Array.isArray(manifest.packages) ||
              JSON.stringify(manifest.packages.map(({ name }) => name)) !== JSON.stringify(names)) {
            fail("package manifest inventory is invalid");
          }
          const expectedFiles = ["package-manifest.json"];
          for (const [index, record] of manifest.packages.entries()) {
            const expectedTarball = `${names[index].slice(1).replace("/", "-")}-${record.version}.tgz`;
            if (record.tarball !== expectedTarball || record.publish !== (record.version === manifest.releaseTag.slice(1)) ||
                !/^[0-9a-f]{64}$/.test(record.sha256) || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(record.integrity)) {
              fail(`${record.name} package metadata is invalid`);
            }
            expectedFiles.push(record.tarball);
          }
          const entries = await readdir(releaseDirectory, { withFileTypes: true });
          if (JSON.stringify(entries.map(({ name }) => name).sort()) !== JSON.stringify(expectedFiles.sort())) {
            fail("release artifact inventory is invalid");
          }
          for (const entry of entries) {
            const metadata = await lstat(resolve(releaseDirectory, entry.name));
            if (entry.name.startsWith(".") || !entry.isFile() || !metadata.isFile() || metadata.isSymbolicLink()) {
              fail("release artifact entries must be regular visible files");
            }
          }
          for (const record of manifest.packages) {
            const tarball = resolve(releaseDirectory, record.tarball);
            const bytes = await readFile(tarball);
            const sha256 = createHash("sha256").update(bytes).digest("hex");
            const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
            if (!equal(sha256, record.sha256) || !equal(integrity, record.integrity)) {
              fail(`${record.name} package digest does not match`);
            }
          }

          const publishDirectory = await mkdtemp(resolve(process.env.RUNNER_TEMP ?? tmpdir(), "npm-publish."));
          const configDirectory = await mkdtemp(resolve(process.env.RUNNER_TEMP ?? tmpdir(), "npm-config."));
          const userConfig = resolve(configDirectory, "userconfig");
          const globalConfig = resolve(configDirectory, "globalconfig");
          await writeFile(userConfig, "", { mode: 0o600 });
          await writeFile(globalConfig, "", { mode: 0o600 });
          const environment = Object.fromEntries(Object.entries(process.env).filter(([key]) =>
            ["CI", "PATH", "HOME", "RUNNER_TEMP", "SYSTEMROOT"].includes(key) || key.startsWith("TMP") ||
            key.startsWith("GITHUB_") || key.startsWith("ACTIONS_ID_TOKEN_")));
          environment.NPM_CONFIG_USERCONFIG = userConfig;
          environment.NPM_CONFIG_GLOBALCONFIG = globalConfig;
          const npm = (args, allowMissing = false) => {
            const result = spawnSync("npm", args, { cwd: publishDirectory, encoding: "utf8", env: environment });
            if (result.error) throw result.error;
            if (result.status !== 0 && !(allowMissing && /\bE404\b/.test(`${result.stdout}\n${result.stderr}`))) {
              fail(`npm ${args[0]} failed: ${result.stderr.trim()}`);
            }
            return result;
          };
          for (const record of manifest.packages.filter(({ publish }) => publish)) {
            const specifier = `${record.name}@${record.version}`;
            const viewed = npm(["view", specifier, "dist.integrity", "--json", "--registry", "https://registry.npmjs.org/", "--ignore-scripts"], true);
            if (viewed.status === 0) {
              const registryIntegrity = JSON.parse(viewed.stdout);
              if (!equal(registryIntegrity, record.integrity)) fail(`${specifier} registry digest differs`);
              continue;
            }
            npm(["publish", resolve(releaseDirectory, record.tarball), "--tag", "latest", "--registry", "https://registry.npmjs.org/", "--access", "public", "--provenance", "--ignore-scripts"]);
          }
          NODE
